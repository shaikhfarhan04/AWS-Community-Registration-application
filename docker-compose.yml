services:

  frontend:
    build:
      context: ./frontend

    container_name: community-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: community-backend

    environment:

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: aws_community
      DB_USER: community_app
      DB_PASSWORD: ${DB_PASSWORD}

    expose:
      - "5000"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


  mysql:
    image: mysql:8.4

    container_name: community-mysql

    environment:

      MYSQL_DATABASE: aws_community

      MYSQL_USER: community_app

      MYSQL_PASSWORD: ${DB_PASSWORD}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:

      - mysql_data:/var/lib/mysql

      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    expose:
      - "3306"

    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

    restart: unless-stopped


volumes:

  mysql_data:
